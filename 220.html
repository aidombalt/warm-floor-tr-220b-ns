<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ТР-220Б-НС — Инструкция терморегулятора | УК «Адмиралтейский двор»</title>
  <meta name="description" content="Официальный паспорт и инструкция по настройке терморегулятора теплого пола ТР-220Б-НС для жителей УК «Адмиралтейский двор»." />
  <meta property="og:title" content="ТР-220Б-НС — Инструкция терморегулятора | УК «Адмиралтейский двор»" />
  <meta property="og:description" content="Официальный паспорт и инструкция по настройке терморегулятора теплого пола ТР-220Б-НС для жителей УК «Адмиралтейский двор»." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root {
      --bg: #f3f5f8;
      --surface: #ffffff;
      --surface-muted: #eef1f5;
      --text: #111827;
      --text-secondary: #5b6472;
      --border: rgba(17, 24, 39, 0.08);
      --accent: #2b8a97;
      --accent-soft: rgba(43, 138, 151, 0.28);
      --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
      --shadow-float: 0 6px 20px rgba(15, 23, 42, 0.12);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    body.slides-mode {
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    body.slides-mode .app {
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .header-top {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-org {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Segmented View Mode Switcher */
    .mode-switch {
      display: inline-flex;
      align-items: center;
      background: var(--surface-muted);
      padding: 3px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
      border: 1px solid rgba(17, 24, 39, 0.05);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .mode-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.1);
    }

    /* Chapter Chips Strip */
    .chapters-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 14px 9px;
      position: relative;
    }

    .chapters {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
      padding: 2px 16px 2px 0;
      -webkit-mask-image: linear-gradient(to right, #000 92%, transparent 100%);
      mask-image: linear-gradient(to right, #000 92%, transparent 100%);
    }

    .chapters::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.22s var(--ease);
    }

    .chip:hover {
      border-color: rgba(17, 24, 39, 0.2);
      color: var(--text);
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-soft);
    }

    /* Progress hairline */
    .progress-track {
      height: 2.5px;
      width: 100%;
      background: rgba(17, 24, 39, 0.06);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.28s var(--ease);
    }

    /* Main Stage - Slides Mode */
    .stage-slides {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .carousel {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      align-items: center;
    }

    .carousel::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px 8px;
    }

    .card-frame {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform 0.25s var(--ease);
    }

    .card-frame img {
      display: block;
      max-width: min(92vw, 660px);
      max-height: calc(100dvh - 190px);
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .zoom-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(17, 24, 39, 0.72);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .zoom-badge:hover {
      background: rgba(17, 24, 39, 0.9);
      transform: scale(1.03);
    }

    .zoom-badge svg {
      width: 14px;
      height: 14px;
    }

    /* Desktop Side Arrows */
    .side-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      box-shadow: var(--shadow-float);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--ease), opacity 0.2s ease, background 0.2s ease;
    }

    .side-arrow:hover:not(:disabled) {
      background: #ffffff;
      transform: translateY(-50%) scale(1.06);
    }

    .side-arrow:disabled {
      opacity: 0.28;
      cursor: default;
      box-shadow: none;
    }

    .side-arrow.prev { left: 18px; }
    .side-arrow.next { right: 18px; }

    @media (min-width: 820px) {
      .side-arrow {
        display: inline-flex;
      }
      .slide {
        padding: 16px 76px 10px;
      }
    }

    /* Bottom Controls Bar (Slides Mode) */
    .bottom-bar {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .bottom-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      height: 38px;
      padding: 0 13px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.18s var(--ease);
      flex-shrink: 0;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--surface-muted);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    .pager-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }

    .pager-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .pager-meta span {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      border: none;
      padding: 0;
      background: rgba(17, 24, 39, 0.18);
      cursor: pointer;
      transition: width 0.24s var(--ease), background 0.24s var(--ease);
    }

    .dot.active {
      width: 18px;
      background: var(--accent);
    }

    /* Vertical Feed Mode */
    .stage-feed {
      display: none;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 48px;
      flex-direction: column;
      gap: 18px;
    }

    body.feed-mode .stage-slides,
    body.feed-mode .bottom-bar {
      display: none;
    }

    body.feed-mode .stage-feed {
      display: flex;
    }

    .feed-item {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      overflow: hidden;
      scroll-margin-top: 112px;
    }

    .feed-item-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fafbfc;
    }

    .feed-item-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .feed-item-label span {
      color: var(--text-secondary);
      font-weight: 500;
      margin-right: 6px;
    }

    .feed-zoom-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .feed-zoom-btn svg {
      width: 13px;
      height: 13px;
    }

    .feed-item img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    /* Fullscreen Zoom Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 14, 22, 0.94);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s var(--ease);
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lb-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      color: #ffffff;
      background: linear-gradient(to bottom, rgba(10, 14, 22, 0.85), rgba(10, 14, 22, 0));
      z-index: 5;
    }

    .lb-title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lb-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .lb-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.16s ease;
    }

    .lb-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
    }

    .lb-btn:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .lb-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: grab;
    }

    .lb-stage.dragging {
      cursor: grabbing;
    }

    .lb-img {
      max-width: 94vw;
      max-height: 78dvh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      transform-origin: center center;
      transition: transform 0.18s var(--ease);
      user-select: none;
      -webkit-user-drag: none;
      background: #ffffff;
    }

    .lb-stage.dragging .lb-img {
      transition: none;
    }

    .lb-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      z-index: 5;
    }

    /* Subtle first-visit swipe toast */
    .hint-toast {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(17, 24, 39, 0.84);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s var(--ease);
      z-index: 40;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .hint-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 440px) {
      .brand-title { font-size: 14.5px; }
      .nav-btn .btn-label { display: none; }
      .nav-btn { padding: 0 11px; }
      .card-frame img { max-height: calc(100dvh - 184px); }
    }
  </style>
</head>
<body class="slides-mode">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <div class="brand-org">УК «Адмиралтейский двор» · Паспорт прибора</div>
          <div class="brand-title">Терморегулятор ТР-220Б-НС</div>
        </div>
        <div class="mode-switch" role="tablist" aria-label="Режим просмотра">
          <button type="button" class="mode-btn active" id="btnModeSlides" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
            Слайды
          </button>
          <button type="button" class="mode-btn" id="btnModeFeed" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg>
            Лента
          </button>
        </div>
      </div>

      <div class="chapters-wrap">
        <nav class="chapters" id="chaptersNav" aria-label="Разделы инструкции"></nav>
      </div>

      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </header>

    <main class="stage-slides" id="stageSlides">
      <button type="button" class="side-arrow prev" id="sidePrev" aria-label="Предыдущая страница">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <div class="carousel" id="carousel" aria-label="Страницы инструкции"></div>

      <button type="button" class="side-arrow next" id="sideNext" aria-label="Следующая страница">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </main>

    <footer class="bottom-bar">
      <div class="bottom-inner">
        <button type="button" class="nav-btn" id="btnPrev" aria-label="Предыдущая страница">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span class="btn-label">Назад</span>
        </button>

        <div class="pager-center">
          <div class="pager-meta" id="pagerMeta">1 / 1</div>
          <div class="dots" id="dotsNav" aria-label="Индикатор страниц"></div>
        </div>

        <button type="button" class="nav-btn" id="btnNext" aria-label="Следующая страница">
          <span class="btn-label">Вперёд</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </footer>

    <section class="stage-feed" id="stageFeed" aria-label="Полная лента инструкции"></section>
  </div>

  <!-- Fullscreen Zoom Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Увеличенный просмотр страницы">
    <div class="lb-top">
      <div class="lb-title" id="lbTitle">Страница 1</div>
      <div class="lb-actions">
        <button type="button" class="lb-btn" id="lbZoomOut" aria-label="Уменьшить">−</button>
        <button type="button" class="lb-btn" id="lbZoomReset" aria-label="Сбросить масштаб">100%</button>
        <button type="button" class="lb-btn" id="lbZoomIn" aria-label="Увеличить">+</button>
        <button type="button" class="lb-btn" id="lbClose" aria-label="Закрыть">✕</button>
      </div>
    </div>
    <div class="lb-stage" id="lbStage">
      <img class="lb-img" id="lbImg" src="" alt="" />
    </div>
    <div class="lb-bottom">
      <button type="button" class="lb-btn" id="lbPrev" aria-label="Предыдущая страница">← Пред.</button>
      <span id="lbHint">Двойной клик или «+» для масштаба</span>
      <button type="button" class="lb-btn" id="lbNext" aria-label="Следующая страница">След. →</button>
    </div>
  </div>

    let currentIndex = 0;
    let currentMode = 'slides';
    let scrollDebounce = null;

    // Lightbox state
    let lbOpen = false;
    let lbScale = 1;
    let lbX = 0;
    let lbY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let lastTapTime = 0;

    const chaptersNav = document.getElementById('chaptersNav');
    const carousel = document.getElementById('carousel');
    const stageFeed = document.getElementById('stageFeed');
    const dotsNav = document.getElementById('dotsNav');
    const pagerMeta = document.getElementById('pagerMeta');
    const progressFill = document.getElementById('progressFill');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const sidePrev = document.getElementById('sidePrev');
    const sideNext = document.getElementById('sideNext');
    const btnModeSlides = document.getElementById('btnModeSlides');
    const btnModeFeed = document.getElementById('btnModeFeed');
    const hintToast = document.getElementById('hintToast');

    const lightbox = document.getElementById('lightbox');
    const lbTitle = document.getElementById('lbTitle');
    const lbStage = document.getElementById('lbStage');
    const lbImg = document.getElementById('lbImg');
    const lbZoomIn = document.getElementById('lbZoomIn');
    const lbZoomOut = document.getElementById('lbZoomOut');
    const lbZoomReset = document.getElementById('lbZoomReset');
    const lbClose = document.getElementById('lbClose');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');

    function buildUI() {
      PAGES.forEach((p, idx) => {
        // Chapter chip
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (idx === 0 ? ' active' : '');
        chip.textContent = p.short;
        chip.dataset.index = idx;
        chip.addEventListener('click', () => goTo(idx, true));
        chaptersNav.appendChild(chip);

        // Slide
        const slide = document.createElement('div');
        slide.className = 'slide';
        slide.dataset.index = idx;

        const frame = document.createElement('div');
        frame.className = 'card-frame';
        frame.addEventListener('click', () => openLightbox(idx));

        const img = document.createElement('img');
        img.src = p.src;
        img.alt = p.title;
        img.loading = idx <= 2 ? 'eager' : 'lazy';
        img.decoding = 'async';

        const zBtn = document.createElement('button');
        zBtn.type = 'button';
        zBtn.className = 'zoom-badge';
        zBtn.setAttribute('aria-label', 'Увеличить страницу ' + (idx + 1));
        zBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg><span>Зум</span>';
        zBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(idx);
        });

        frame.appendChild(img);
        frame.appendChild(zBtn);
        slide.appendChild(frame);
        carousel.appendChild(slide);

        // Dot
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot' + (idx === 0 ? ' active' : '');
        dot.setAttribute('aria-label', 'Перейти к странице ' + (idx + 1));
        dot.addEventListener('click', () => goTo(idx, true));
        dotsNav.appendChild(dot);

        // Feed item
        const feedItem = document.createElement('article');
        feedItem.className = 'feed-item';
        feedItem.id = 'feed-page-' + idx;

        const head = document.createElement('div');
        head.className = 'feed-item-head';

        const lbl = document.createElement('div');
        lbl.className = 'feed-item-label';
        lbl.innerHTML = '<span>Стр. ' + (idx + 1) + ' из ' + PAGES.length + '</span>' + p.title;

        const fzBtn = document.createElement('button');
        fzBtn.type = 'button';
        fzBtn.className = 'feed-zoom-btn';
        fzBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>Увеличить';
        fzBtn.addEventListener('click', () => openLightbox(idx));

        head.appendChild(lbl);
        head.appendChild(fzBtn);

        const fImg = document.createElement('img');
        fImg.src = p.src;
        fImg.alt = p.title;
        fImg.loading = 'lazy';
        fImg.addEventListener('click', () => openLightbox(idx));

        feedItem.appendChild(head);
        feedItem.appendChild(fImg);
        stageFeed.appendChild(feedItem);
      });

      updateIndicators(0);
    }

    function updateIndicators(idx) {
      currentIndex = idx;
      const p = PAGES[idx];

      // Update chips
      const chips = chaptersNav.querySelectorAll('.chip');
      chips.forEach((c, i) => {
        const isActive = i === idx;
        c.classList.toggle('active', isActive);
        if (isActive) {
          c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });

      // Update dots
      const dots = dotsNav.querySelectorAll('.dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));

      // Update meta & progress
      pagerMeta.innerHTML = (idx + 1) + ' / ' + PAGES.length + ' <span>· ' + p.short + '</span>';
      progressFill.style.width = (((idx + 1) / PAGES.length) * 100) + '%';

      const isFirst = idx === 0;
      const isLast = idx === PAGES.length - 1;
      btnPrev.disabled = isFirst;
      sidePrev.disabled = isFirst;
      btnNext.disabled = isLast;
      sideNext.disabled = isLast;
    }

    function goTo(idx, smooth) {
      const target = Math.max(0, Math.min(PAGES.length - 1, idx));
      if (currentMode === 'slides') {
        carousel.scrollTo({
          left: target * carousel.clientWidth,
          behavior: smooth ? 'smooth' : 'auto'
        });
        updateIndicators(target);
      } else {
        const el = document.getElementById('feed-page-' + target);
        if (el) {
          el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        }
        updateIndicators(target);
      }
    }

    function setMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      document.body.classList.toggle('slides-mode', mode === 'slides');
      document.body.classList.toggle('feed-mode', mode === 'feed');
      btnModeSlides.classList.toggle('active', mode === 'slides');
      btnModeSlides.setAttribute('aria-selected', String(mode === 'slides'));
      btnModeFeed.classList.toggle('active', mode === 'feed');
      btnModeFeed.setAttribute('aria-selected', String(mode === 'feed'));

      requestAnimationFrame(() => {
        goTo(currentIndex, false);
      });
    }

    // Carousel scroll sync
    carousel.addEventListener('scroll', () => {
      if (currentMode !== 'slides') return;
      const w = carousel.clientWidth || 1;
      const idx = Math.round(carousel.scrollLeft / w);
      if (idx !== currentIndex && idx >= 0 && idx < PAGES.length) {
        updateIndicators(idx);
      }
    }, { passive: true });

    // Resize sync
    window.addEventListener('resize', () => {
      if (currentMode === 'slides') {
        carousel.scrollTo({ left: currentIndex * carousel.clientWidth, behavior: 'auto' });
      }
    });

    // Feed mode scroll spy
    window.addEventListener('scroll', () => {
      if (currentMode !== 'feed') return;
      clearTimeout(scrollDebounce);
      scrollDebounce = setTimeout(() => {
        const items = stageFeed.querySelectorAll('.feed-item');
        let bestIdx = currentIndex;
        let bestDist = Infinity;
        items.forEach((item, i) => {
          const rect = item.getBoundingClientRect();
          const dist = Math.abs(rect.top - 120);
          if (dist < bestDist) {
            bestDist = dist;
            bestIdx = i;
          }
        });
        if (bestIdx !== currentIndex) {
          updateIndicators(bestIdx);
        }
      }, 60);
    }, { passive: true });

    // Lightbox functions
    function applyLbTransform() {
      lbImg.style.transform = 'translate(' + lbX + 'px, ' + lbY + 'px) scale(' + lbScale + ')';
      lbZoomReset.textContent = Math.round(lbScale * 100) + '%';
    }

    function setLbScale(newScale) {
      lbScale = Math.max(1, Math.min(3.5, newScale));
      if (lbScale === 1) {
        lbX = 0;
        lbY = 0;
      }
      applyLbTransform();
    }

    function openLightbox(idx) {
      goTo(idx, false);
      const p = PAGES[idx];
      lbImg.src = p.src;
      lbImg.alt = p.title;
      lbTitle.textContent = (idx + 1) + ' / ' + PAGES.length + ' · ' + p.title;
      lbScale = 1;
      lbX = 0;
      lbY = 0;
      applyLbTransform();
      lbPrev.disabled = idx === 0;
      lbNext.disabled = idx === PAGES.length - 1;
      lightbox.classList.add('open');
      lbOpen = true;
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbOpen = false;
    }

    lbZoomIn.addEventListener('click', () => setLbScale(lbScale + 0.6));
    lbZoomOut.addEventListener('click', () => setLbScale(lbScale - 0.6));
    lbZoomReset.addEventListener('click', () => setLbScale(1));
    lbClose.addEventListener('click', closeLightbox);

    lbPrev.addEventListener('click', () => {
      if (currentIndex > 0) openLightbox(currentIndex - 1);
    });
    lbNext.addEventListener('click', () => {
      if (currentIndex < PAGES.length - 1) openLightbox(currentIndex + 1);
    });

    // Double click / tap to toggle zoom in lightbox
    lbStage.addEventListener('click', (e) => {
      if (e.target === lbStage && lbScale === 1) {
        closeLightbox();
        return;
      }
      const now = Date.now();
      if (now - lastTapTime < 280) {
        setLbScale(lbScale > 1.2 ? 1 : 2.2);
      }
      lastTapTime = now;
    });

    // Pan inside lightbox (pointer events)
    lbStage.addEventListener('pointerdown', (e) => {
      if (lbScale <= 1) return;
      isDragging = true;
      lbStage.classList.add('dragging');
      dragStartX = e.clientX - lbX;
      dragStartY = e.clientY - lbY;
      lbStage.setPointerCapture(e.pointerId);
    });

    lbStage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      lbX = e.clientX - dragStartX;
      lbY = e.clientY - dragStartY;
      applyLbTransform();
    });

    lbStage.addEventListener('pointerup', () => {
      isDragging = false;
      lbStage.classList.remove('dragging');
    });

    lbStage.addEventListener('wheel', (e) => {
      if (!lbOpen) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      setLbScale(lbScale + delta);
    }, { passive: false });

    // Button listeners
    btnPrev.addEventListener('click', () => goTo(currentIndex - 1, true));
    btnNext.addEventListener('click', () => goTo(currentIndex + 1, true));
    sidePrev.addEventListener('click', () => goTo(currentIndex - 1, true));
    sideNext.addEventListener('click', () => goTo(currentIndex + 1, true));
    btnModeSlides.addEventListener('click', () => setMode('slides'));
    btnModeFeed.addEventListener('click', () => setMode('feed'));

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lbOpen) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft' && currentIndex > 0) openLightbox(currentIndex - 1);
        else if (e.key === 'ArrowRight' && currentIndex < PAGES.length - 1) openLightbox(currentIndex + 1);
        else if (e.key === '+' || e.key === '=') setLbScale(lbScale + 0.5);
        else if (e.key === '-') setLbScale(lbScale - 0.5);
        return;
      }
      if (currentMode === 'slides') {
        if (e.key === 'ArrowLeft') goTo(currentIndex - 1, true);
        else if (e.key === 'ArrowRight') goTo(currentIndex + 1, true);
      }
    });

    // Init
    buildUI();

    // Show brief unobtrusive hint once
    setTimeout(() => {
      hintToast.classList.add('show');
      setTimeout(() => hintToast.classList.remove('show'), 2800);
    }, 500);
  </script>
</body>
</html>
